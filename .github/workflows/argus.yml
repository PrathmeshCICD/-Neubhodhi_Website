name: Argus review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: karlmehta/argus/.github/workflows/argus-review.yml@v1
    secrets: inherit
